name: AutoPost

# cron 投稿は停止 (2026-06-06): @keroro_4649 graduated-access 対応のため
# 投稿ロジック (auto_post.py 等) は触らず、workflow_dispatch 経由の手動実行のみ残置
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "テスト実行(X投稿なし)"
        required: false
        default: "false"
      force:
        description: "スロット選択を無視して強制実行(手動テスト用)"
        required: false
        default: "true"

jobs:
  post:
    runs-on: ubuntu-latest
    # スキップ時は数十秒、採用時もジッター 0〜10 分 + 処理時間で完結
    timeout-minutes: 20
    concurrency:
      group: autopost-x
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # posts.db を run 間で保持(重複投稿防止)
      - name: Restore posts DB
        uses: actions/cache@v4
        with:
          path: posts.db
          key: posts-db-${{ github.run_id }}
          restore-keys: |
            posts-db-

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Post
        env:
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY:       ${{ secrets.X_API_KEY }}
          X_API_SECRET:    ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:  ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.force }}" = "true" ]; then
              ARGS="$ARGS --force"
            fi
            if [ "${{ github.event.inputs.dry }}" = "true" ]; then
              ARGS="$ARGS --dry"
            fi
          fi
          python auto_post.py $ARGS

      # posts.db をアーティファクトとして保存(念のため・可視化用)
      - name: Save posts DB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posts-db-${{ github.run_number }}
          path: posts.db
          retention-days: 30
